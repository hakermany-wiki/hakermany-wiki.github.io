name: Publish wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    # Standard public-repository runners only. Never run this workflow in a private repo.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: bun run check:links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
